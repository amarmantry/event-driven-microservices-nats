server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trams_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom NATS properties loaded dynamically
nats:
  url: ${NATS_URL:nats://localhost:4222}
  token: ${NATS_AUTH_TOKEN:super_secure_nats_token_2026}
  stream-name: USERS_STREAM
  subject: user.events.created